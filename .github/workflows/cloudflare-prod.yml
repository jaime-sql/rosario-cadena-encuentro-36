name: Cloudflare Prod

on:
  workflow_dispatch:
  push:
    tags:
      - "prod-*"

permissions:
  contents: read

concurrency:
  group: cloudflare-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit
      - run: npm test

      - name: Check deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          url="${PUBLIC_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          key="${PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Repository Actions secrets PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_ANON_KEY are missing (NEXT_PUBLIC_* aliases also accepted)."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Repository Actions secret CLOUDFLARE_API_TOKEN is missing. Create a token with Cloudflare Pages + Workers edit on account 8a8c9483df8e8a2a9adec437a0994fe4."
            exit 1
          fi
          echo "Deploy secrets are present (values not printed)."

      - name: Build static site
        run: npm run build
        env:
          CLOUDFLARE_PROD: "true"
          BASE_PATH: /rosariocadena
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Confirm Supabase is inlined
        run: |
          set -euo pipefail
          if ! grep -R -F -q "kwbhytabavegnqfeidjw.supabase.co" out; then
            echo "::error::Built site does not contain the Supabase project URL. Secrets were not inlined into the client bundle."
            exit 1
          fi
          echo "Supabase project URL is present in the static build."

      - name: Deploy Pages project rosario-cadena
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '8a8c9483df8e8a2a9adec437a0994fe4' }}
          command: pages deploy out --project-name=rosario-cadena --branch=main

      - name: Deploy path Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '8a8c9483df8e8a2a9adec437a0994fe4' }}
          command: deploy --config workers/rosariocadena-path/wrangler.jsonc
