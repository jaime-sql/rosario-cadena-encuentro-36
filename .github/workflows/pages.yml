name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref of the app source to build
        required: false
        default: main

# The github-pages environment currently allows only the gh-pages branch, so
# environment secrets are invisible on main. Push/dispatch on main retriggers
# this same workflow on gh-pages, where the build job can read those secrets.
permissions:
  contents: read
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  dispatch-from-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch build on gh-pages ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_ref="${{ github.event.inputs.source_ref || 'main' }}"
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref gh-pages \
            -f "source_ref=${source_ref}"

  build:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit
      - run: npm test

      - name: Check Supabase secrets
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          url="${PUBLIC_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          key="${PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::github-pages environment secrets are missing. Set PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_ANON_KEY (or NEXT_PUBLIC_* aliases) on the github-pages environment, and allow this branch if a deployment branch policy is enabled."
            exit 1
          fi
          echo "Supabase secrets are present (values not printed)."

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Confirm Supabase is inlined
        run: |
          set -euo pipefail
          if ! grep -R -F -q "kwbhytabavegnqfeidjw.supabase.co" out; then
            echo "::error::Built site does not contain the Supabase project URL. Secrets were not inlined into the client bundle."
            exit 1
          fi
          echo "Supabase project URL is present in the static build."

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          keep="$(mktemp -d)"
          if [ -d "$work/.github" ]; then
            cp -a "$work/.github" "$keep/"
          fi
          find "$work" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a out/. "$work/"
          mkdir -p "$work/.github/workflows"
          if [ -d "$keep/.github" ]; then
            cp -a "$keep/.github/." "$work/.github/"
          fi
          cp -f .github/workflows/pages.yml "$work/.github/workflows/pages.yml"
          cd "$work"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi
          git commit -m "Publish static GitHub Pages site"
          git push origin gh-pages
